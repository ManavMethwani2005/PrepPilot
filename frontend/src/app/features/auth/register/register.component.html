<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="brand-pill">
        <span class="brand-icon">⚡</span>
        <span class="brand-name">PrepPilot</span>
      </div>
      <h2>Create your PrepPilot account</h2>
      <p class="subtitle">Build a study plan you can actually follow.</p>
    </div>

    @if (errorMessage) {
      <div class="alert alert-danger" role="alert">
        <span class="alert-icon">⚠️</span>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <div class="form-group">
        <label for="reg-fullname">Full name</label>
        <input
          type="text"
          id="reg-fullname"
          [(ngModel)]="fullName"
          name="fullName"
          required
          maxlength="80"
          autocomplete="name"
          placeholder="e.g. Maya Lin"
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label for="reg-email">Email address</label>
        <input
          type="email"
          id="reg-email"
          [(ngModel)]="email"
          name="email"
          required
          autocomplete="email"
          placeholder="maya@university.edu"
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="reg-password">Password (min 6 characters)</label>
        </div>
        <div class="password-input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="reg-password"
            [(ngModel)]="password"
            name="password"
            required
            minlength="6"
            autocomplete="new-password"
            placeholder="••••••••"
            [disabled]="loading"
          />
          <button
            type="button"
            class="btn-toggle-password"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="btn-primary btn-submit"
        [disabled]="loading || !fullName || !email || !password || password.length < 6"
      >
        @if (loading) {
          <span class="spinner-dot"></span>
          <span>Creating your account...</span>
        } @else {
          <span>Start Planning Free</span>
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
